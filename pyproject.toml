[project]
name = "nordhjem-store"
version = "0.1.0"
description = "Nordhjem store: product search, RAG and an agent on Google Cloud"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "google-cloud-firestore>=2.34.1",
    "google-genai>=3.2.0",
    "numpy>=2.5.4",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
]
